<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adding Fractions</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f6fa;
}

header{
    background:#004080;
    color:white;
    padding:20px;
    text-align:center;
}

.controls{
    text-align:center;
    padding:20px;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:#0073e6;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005bb5;
}

#allView{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.question-card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.answer{
    display:none;
    margin-top:15px;
    color:green;
    font-weight:bold;
}

#singleView{
    display:none;
    min-height:70vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.big-question{
    font-size:4rem;
    margin-bottom:40px;
}

.big-answer{
    font-size:2rem;
    color:green;
    display:none;
    margin:20px;
}

.navigation{
    margin-top:20px;
}

</style>
</head>
<body>

<header>
<h1>Adding Fractions</h1>
<p>15 Questions Increasing in Difficulty</p>
</header>

<div class="controls">
<button onclick="showAll()">All Questions</button>
<button onclick="showSingle()">One Question at a Time</button>
</div>

<div id="allView"></div>

<div id="singleView">

<h2 id="questionNumber"></h2>

<div class="big-question" id="currentQuestion"></div>

<button onclick="toggleSingleAnswer()">
Reveal Answer
</button>

<div class="big-answer" id="currentAnswer"></div>

<div class="navigation">
<button onclick="previousQuestion()">Previous</button>
<button onclick="nextQuestion()">Next</button>
</div>

</div>

<script>

const questions = [

{
q:"1/2 + 1/4",
a:"3/4"
},

{
q:"1/3 + 1/3",
a:"2/3"
},

{
q:"3/4 + 1/8",
a:"7/8"
},

{
q:"2/5 + 1/5",
a:"3/5"
},

{
q:"2/3 + 1/6",
a:"5/6"
},

{
q:"3/4 + 1/3",
a:"13/12 = 1 1/12"
},

{
q:"5/8 + 3/4",
a:"11/8 = 1 3/8"
},

{
q:"7/8 + 2/3",
a:"37/24 = 1 13/24"
},

{
q:"5/6 + 3/4",
a:"19/12 = 1 7/12"
},

{
q:"7/10 + 3/5",
a:"13/10 = 1 3/10"
},

{
q:"3/4 + 5/6",
a:"19/12 = 1 7/12"
},

{
q:"7/8 + 5/6",
a:"41/24 = 1 17/24"
},

{
q:"5/12 + 7/18",
a:"29/36"
},

{
q:"7/15 + 11/20",
a:"61/60 = 1 1/60"
},

{
q:"17/24 + 5/18",
a:"71/72"
}

];

const allView = document.getElementById("allView");

questions.forEach((item,index)=>{

allView.innerHTML += `
<div class="question-card">

<h2>Q${index+1}</h2>

<p style="font-size:1.8rem;">
${item.q}
</p>

<button onclick="this.nextElementSibling.style.display='block'">
Reveal Answer
</button>

<div class="answer">
${item.a}
</div>

</div>
`;

});

let current = 0;

function displayQuestion(){

document.getElementById("questionNumber").innerText =
`Question ${current+1} of 15`;

document.getElementById("currentQuestion").innerText =
questions[current].q;

document.getElementById("currentAnswer").innerText =
questions[current].a;

document.getElementById("currentAnswer").style.display="none";

}

function nextQuestion(){

if(current < questions.length-1){
current++;
displayQuestion();
}

}

function previousQuestion(){

if(current > 0){
current--;
displayQuestion();
}

}

function toggleSingleAnswer(){

const answer =
document.getElementById("currentAnswer");

if(answer.style.display==="block"){
answer.style.display="none";
}
else{
answer.style.display="block";
}

}

function showAll(){

document.getElementById("allView").style.display="grid";
document.getElementById("singleView").style.display="none";

}

function showSingle(){

document.getElementById("allView").style.display="none";
document.getElementById("singleView").style.display="flex";

displayQuestion();

}

</script>

</body>
</html>
