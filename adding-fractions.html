<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adding Fractions</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f6fa;
}

header{
    background:#004080;
    color:white;
    padding:20px;
    text-align:center;
}

.controls{
    text-align:center;
    padding:20px;
}

button,
.home-btn{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    background:#0073e6;
    color:white;
    cursor:pointer;
    font-size:16px;
    text-decoration:none;
    display:inline-block;
}

button:hover,
.home-btn:hover{
    background:#005bb5;
}

#allView{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.question-card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.answer{
    display:none;
    margin-top:15px;
    color:green;
    font-weight:bold;
    font-size:1.5rem;
}

#singleView{
    display:none;
    min-height:70vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.big-question{
    font-size:5rem;
    line-height:1.5;
    margin-bottom:40px;
}

.big-answer{
    font-size:3rem;
    color:green;
    display:none;
    margin:20px;
}

.navigation{
    margin-top:20px;
}

.fraction{
    display:inline-block;
    text-align:center;
    vertical-align:middle;
    margin:0 8px;
}

.fraction .top{
    display:block;
    border-bottom:3px solid black;
    padding:0 10px;
}

.fraction .bottom{
    display:block;
    padding:0 10px;
}

.big-question .fraction{
    font-size:1.3em;
}

.big-answer .fraction{
    font-size:1em;
}

</style>
</head>

<body>

<header>
    <h1>Adding Fractions</h1>
    <p>15 Questions Increasing in Difficulty</p>
</header>

<div class="controls">

    <a href="index.html" class="home-btn">🏠 Home</a>

    <button onclick="showAll()">All Questions</button>

    <button onclick="showSingle()">One Question at a Time</button>

</div>

<div id="allView"></div>

<div id="singleView">

    <h2 id="questionNumber"></h2>

    <div class="big-question" id="currentQuestion"></div>

    <button onclick="toggleSingleAnswer()">
        Reveal Answer
    </button>

    <div class="big-answer" id="currentAnswer"></div>

    <div class="navigation">
        <button onclick="previousQuestion()">Previous</button>
        <button onclick="nextQuestion()">Next</button>
    </div>

</div>

<script>

const questions = [

{
q:`<span class="fraction"><span class="top">1</span><span class="bottom">2</span></span> + <span class="fraction"><span class="top">1</span><span class="bottom">4</span></span>`,
a:`<span class="fraction"><span class="top">3</span><span class="bottom">4</span></span>`
},

{
q:`<span class="fraction"><span class="top">1</span><span class="bottom">3</span></span> + <span class="fraction"><span class="top">1</span><span class="bottom">3</span></span>`,
a:`<span class="fraction"><span class="top">2</span><span class="bottom">3</span></span>`
},

{
q:`<span class="fraction"><span class="top">3</span><span class="bottom">4</span></span> + <span class="fraction"><span class="top">1</span><span class="bottom">8</span></span>`,
a:`<span class="fraction"><span class="top">7</span><span class="bottom">8</span></span>`
},

{
q:`<span class="fraction"><span class="top">2</span><span class="bottom">5</span></span> + <span class="fraction"><span class="top">1</span><span class="bottom">5</span></span>`,
a:`<span class="fraction"><span class="top">3</span><span class="bottom">5</span></span>`
},

{
q:`<span class="fraction"><span class="top">2</span><span class="bottom">3</span></span> + <span class="fraction"><span class="top">1</span><span class="bottom">6</span></span>`,
a:`<span class="fraction"><span class="top">5</span><span class="bottom">6</span></span>`
},

{
q:`<span class="fraction"><span class="top">3</span><span class="bottom">4</span></span> + <span class="fraction"><span class="top">1</span><span class="bottom">3</span></span>`,
a:`1 <span class="fraction"><span class="top">1</span><span class="bottom">12</span></span>`
},

{
q:`<span class="fraction"><span class="top">5</span><span class="bottom">8</span></span> + <span class="fraction"><span class="top">3</span><span class="bottom">4</span></span>`,
a:`1 <span class="fraction"><span class="top">3</span><span class="bottom">8</span></span>`
},

{
q:`<span class="fraction"><span class="top">7</span><span class="bottom">8</span></span> + <span class="fraction"><span class="top">2</span><span class="bottom">3</span></span>`,
a:`1 <span class="fraction"><span class="top">13</span><span class="bottom">24</span></span>`
},

{
q:`<span class="fraction"><span class="top">5</span><span class="bottom">6</span></span> + <span class="fraction"><span class="top">3</span><span class="bottom">4</span></span>`,
a:`1 <span class="fraction"><span class="top">7</span><span class="bottom">12</span></span>`
},

{
q:`<span class="fraction"><span class="top">7</span><span class="bottom">10</span></span> + <span class="fraction"><span class="top">3</span><span class="bottom">5</span></span>`,
a:`1 <span class="fraction"><span class="top">3</span><span class="bottom">10</span></span>`
},

{
q:`<span class="fraction"><span class="top">3</span><span class="bottom">4</span></span> + <span class="fraction"><span class="top">5</span><span class="bottom">6</span></span>`,
a:`1 <span class="fraction"><span class="top">7</span><span class="bottom">12</span></span>`
},

{
q:`<span class="fraction"><span class="top">7</span><span class="bottom">8</span></span> + <span class="fraction"><span class="top">5</span><span class="bottom">6</span></span>`,
a:`1 <span class="fraction"><span class="top">17</span><span class="bottom">24</span></span>`
},

{
q:`<span class="fraction"><span class="top">5</span><span class="bottom">12</span></span> + <span class="fraction"><span class="top">7</span><span class="bottom">18</span></span>`,
a:`<span class="fraction"><span class="top">29</span><span class="bottom">36</span></span>`
},

{
q:`<span class="fraction"><span class="top">7</span><span class="bottom">15</span></span> + <span class="fraction"><span class="top">11</span><span class="bottom">20</span></span>`,
a:`1 <span class="fraction"><span class="top">1</span><span class="bottom">60</span></span>`
},

{
q:`<span class="fraction"><span class="top">17</span><span class="bottom">24</span></span> + <span class="fraction"><span class="top">5</span><span class="bottom">18</span></span>`,
a:`<span class="fraction"><span class="top">71</span><span class="bottom">72</span></span>`
}

];

const allView = document.getElementById("allView");

questions.forEach((item,index)=>{

allView.innerHTML += `

<div class="question-card">

<h2>Q${index+1}</h2>

<div style="font-size:2rem; margin:20px;">
${item.q}
</div>

<button onclick="this.nextElementSibling.style.display='block'">
Reveal Answer
</button>

<div class="answer">
${item.a}
</div>

</div>

`;

});

let current = 0;

function displayQuestion(){

document.getElementById("questionNumber").innerText =
`Question ${current+1} of 15`;

document.getElementById("currentQuestion").innerHTML =
questions[current].q;

document.getElementById("currentAnswer").innerHTML =
questions[current].a;

document.getElementById("currentAnswer").style.display = "none";

}

function nextQuestion(){

if(current < questions.length-1){
current++;
displayQuestion();
}

}

function previousQuestion(){

if(current > 0){
current--;
displayQuestion();
}

}

function toggleSingleAnswer(){

const answer =
document.getElementById("currentAnswer");

if(answer.style.display === "block"){
answer.style.display = "none";
}
else{
answer.style.display = "block";
}

}

function showAll(){

document.getElementById("allView").style.display = "grid";
document.getElementById("singleView").style.display = "none";

}

function showSingle(){

document.getElementById("allView").style.display = "none";ngleView").style.display = "flex";

displayQuestion();

}

</script>

</body>
</html>
